<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="80" viewBox="0 0 1200 80">

  <style>
    text {
      font-family: Segoe UI, Inter, Arial, sans-serif;
      font-size: 28px;
      font-weight: 600;
      fill: #A78BFA;
      text-anchor: middle;
    }
  </style>

  <text x="600" y="50">
    <tspan opacity="1">
      Building Scalable Full-Stack Web Applications
      <animate attributeName="opacity" values="1;0;0;0" dur="16s" repeatCount="indefinite"/>
    </tspan>

    <tspan x="600" y="50" opacity="0">
      Working with MERN Stack & Modern Web Technologies
      <animate attributeName="opacity" values="0;1;0;0" dur="16s" repeatCount="indefinite"/>
    </tspan>

    <tspan x="600" y="50" opacity="0">
      Strengthening DSA & Problem-Solving in C++
      <animate attributeName="opacity" values="0;0;1;0" dur="16s" repeatCount="indefinite"/>
    </tspan>

    <tspan x="600" y="50" opacity="0">
      Interested in System Design & Real-World Products
      <animate attributeName="opacity" values="0;0;0;1" dur="16s" repeatCount="indefinite"/>
    </tspan>
  </text>
</svg>
